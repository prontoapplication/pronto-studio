<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révision Brevet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue1:#0a0e2a;--blue2:#0d1740;--blue3:#112266;--accent:#4f8cff;--accent2:#a78bfa;
  --glow:#4f8cff;--white:#fff;--gray:#b0bcd4;--card:#131c3e;--border:#1e2d5a;
  --green:#22d48a;--red:#ff5a7e;--yellow:#ffd76e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--blue1);color:var(--white);min-height:100vh;overflow-x:hidden}

/* ========== ANIMATED BG ========== */
.bg-anim{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.28;animation:blobMove 14s ease-in-out infinite alternate}
.blob1{width:520px;height:520px;background:radial-gradient(circle,#2563eb,#6d28d9);top:-120px;left:-100px;animation-delay:0s}
.blob2{width:400px;height:400px;background:radial-gradient(circle,#0ea5e9,#7c3aed);bottom:-80px;right:-80px;animation-delay:-5s}
.blob3{width:300px;height:300px;background:radial-gradient(circle,#4f8cff,#a78bfa);top:40%;left:50%;animation-delay:-9s}
@keyframes blobMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,40px) scale(1.12)}}
.grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(79,140,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(79,140,255,.06) 1px,transparent 1px);background-size:48px 48px}

/* ========== SCREENS ========== */
.screen{position:relative;z-index:1}

/* ========== WELCOME SCREEN ========== */
#welcome-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.welcome-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(79,140,255,.13);border:1px solid rgba(79,140,255,.3);border-radius:999px;padding:6px 18px;font-size:13px;color:#a5c4ff;margin-bottom:2rem;backdrop-filter:blur(8px)}
.welcome-badge span{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.welcome-title{font-size:clamp(2.5rem,8vw,5.5rem);font-weight:900;letter-spacing:-2px;line-height:1.05;margin-bottom:1.5rem;position:relative}
.glow-text{background:linear-gradient(135deg,#fff 30%,#a5c4ff 60%,#c4b5fd 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 40px rgba(79,140,255,.5))}
.glow-sub{font-size:clamp(1rem,3vw,1.4rem);color:var(--accent);font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:1rem;text-shadow:0 0 20px rgba(79,140,255,.8)}
.welcome-desc{font-size:1.05rem;color:var(--gray);max-width:520px;line-height:1.7;margin-bottom:3rem}
.enter-btn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:16px;padding:18px 52px;font-size:1.1rem;font-weight:700;cursor:pointer;letter-spacing:.5px;box-shadow:0 0 40px rgba(79,140,255,.4),0 4px 24px rgba(0,0,0,.3);transition:all .2s;position:relative;overflow:hidden}
.enter-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .2s}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(79,140,255,.6),0 8px 32px rgba(0,0,0,.4)}
.enter-btn:hover::before{opacity:1}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:var(--op,.8);transform:scale(1)}}

/* ========== MAIN APP ========== */
#app-screen{display:none;min-height:100vh}
.app-header{padding:1.25rem 2rem;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);backdrop-filter:blur(12px);background:rgba(10,14,42,.6);position:sticky;top:0;z-index:100}
.app-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 16px rgba(79,140,255,.4)}
.app-title{font-size:17px;font-weight:700;color:#fff}
.app-subtitle{font-size:13px;color:var(--gray)}
.header-score{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray)}
.score-pill{background:rgba(79,140,255,.15);border:1px solid rgba(79,140,255,.3);border-radius:999px;padding:4px 14px;font-size:13px;font-weight:600;color:#a5c4ff}

/* ========== SUBJECT TABS ========== */
.subjects-nav{padding:1.5rem 2rem 0;max-width:1100px;margin:0 auto}
.subjects-nav h2{font-size:13px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:1rem}
.tabs-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:0}
.tab-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:8px 18px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px}
.tab-btn:hover{border-color:rgba(79,140,255,.4);color:#a5c4ff;background:rgba(79,140,255,.08)}
.tab-btn.active{background:linear-gradient(135deg,rgba(37,99,235,.25),rgba(124,58,237,.2));border-color:rgba(79,140,255,.6);color:#fff;box-shadow:0 0 12px rgba(79,140,255,.2)}
.tab-divider{height:1px;background:var(--border);margin:1rem 2rem 0;max-width:calc(1100px - 4rem)}

/* ========== SUBJECT CONTENT ========== */
.subject-content{padding:1.5rem 2rem;max-width:1100px;margin:0 auto}
.subject-header{display:flex;align-items:center;gap:16px;margin-bottom:1.5rem;padding:1.5rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px}
.subject-icon-big{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.subject-title-group h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px}
.subject-title-group p{font-size:13px;color:var(--gray);line-height:1.5}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:2rem}
.mode-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:1.25rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.mode-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .2s;background:linear-gradient(135deg,rgba(37,99,235,.1),rgba(124,58,237,.08))}
.mode-card:hover{border-color:rgba(79,140,255,.5);transform:translateY(-2px);box-shadow:0 4px 24px rgba(79,140,255,.12)}
.mode-card:hover::before{opacity:1}
.mode-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-block;margin-bottom:10px;letter-spacing:.3px}
.mode-card h3{font-size:15px;font-weight:700;color:#fff;margin-bottom:5px}
.mode-card p{font-size:12px;color:var(--gray);line-height:1.5}
.q-count{font-size:11px;color:var(--accent);margin-top:8px;font-weight:600}

/* ========== QUIZ ========== */
.quiz-wrap{padding:1.5rem 2rem;max-width:720px;margin:0 auto}
.back-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--gray);display:inline-flex;align-items:center;gap:6px;margin-bottom:1.25rem;transition:all .15s}
.back-btn:hover{color:#fff;border-color:rgba(79,140,255,.4);background:rgba(79,140,255,.08)}
.progress-row{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-bottom:8px}
.progress-bar{background:rgba(255,255,255,.08);border-radius:4px;height:6px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.q-card{background:rgba(19,28,62,.8);border:1px solid var(--border);border-radius:18px;padding:1.75rem;margin-bottom:1rem;backdrop-filter:blur(8px)}
.q-cat{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.q-cat::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.q-text{font-size:16px;font-weight:600;line-height:1.65;color:#fff;margin-bottom:1.5rem}
.options{display:flex;flex-direction:column;gap:9px}
.opt{background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;text-align:left;cursor:pointer;font-size:14px;font-weight:500;color:#d4dff5;transition:all .15s;display:flex;align-items:center;gap:12px;font-family:inherit}
.opt:hover:not(:disabled){border-color:rgba(79,140,255,.5);background:rgba(79,140,255,.08);color:#fff}
.opt-letter{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .15s}
.opt.correct{border-color:var(--green)!important;background:rgba(34,212,138,.1)!important;color:var(--green)!important}
.opt.correct .opt-letter{background:rgba(34,212,138,.2);border-color:var(--green);color:var(--green)}
.opt.wrong{border-color:var(--red)!important;background:rgba(255,90,126,.08)!important;color:var(--red)!important}
.opt.wrong .opt-letter{background:rgba(255,90,126,.15);border-color:var(--red);color:var(--red)}
.opt:disabled{cursor:default}

/* ========== FEEDBACK ========== */
.feedback{border-radius:16px;padding:1.25rem 1.5rem;margin-top:1.25rem;animation:feedIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes feedIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.feedback.correct-fb{background:rgba(34,212,138,.08);border:1.5px solid rgba(34,212,138,.3)}
.feedback.wrong-fb{background:rgba(255,90,126,.06);border:1.5px solid rgba(255,90,126,.25)}
.fb-head{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;margin-bottom:12px}
.fb-head.ok{color:var(--green)}
.fb-head.nope{color:var(--red)}
.fb-icon{font-size:22px}
.fb-section{margin-top:12px}
.fb-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;opacity:.7}
.fb-body{font-size:13px;line-height:1.75;color:#c8d8f5}
.fb-tip{margin-top:12px;background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.25);border-radius:10px;padding:11px 14px}
.fb-tip .fb-label{color:var(--accent)}
.fb-correction{margin-top:10px;background:rgba(255,90,126,.08);border:1px solid rgba(255,90,126,.2);border-radius:10px;padding:11px 14px}
.fb-correction .fb-label{color:var(--red)}
.fb-example{margin-top:10px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.2);border-radius:10px;padding:11px 14px}
.fb-example .fb-label{color:var(--accent2)}
.math-box{font-family:monospace;font-size:14px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin:8px 0;text-align:center;color:#a5c4ff}
.next-btn{width:100%;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:1.25rem;transition:all .2s;letter-spacing:.2px;font-family:inherit}
.next-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 20px rgba(79,140,255,.35)}

/* ========== AUTO INPUT ========== */
.auto-row{display:flex;gap:10px;margin-top:14px}
.auto-input{flex:1;background:rgba(255,255,255,.06);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:15px;color:#fff;font-family:inherit;transition:border-color .15s}
.auto-input:focus{outline:none;border-color:rgba(79,140,255,.6);background:rgba(79,140,255,.06)}
.auto-input::placeholder{color:rgba(255,255,255,.2)}
.submit-btn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s}
.submit-btn:hover{opacity:.9}

/* ========== SCORE ========== */
.score-wrap{padding:2rem;max-width:520px;margin:0 auto;text-align:center}
.score-circle{width:130px;height:130px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 2rem;border:3px solid;position:relative}
.score-circle::before{content:'';position:absolute;inset:-8px;border-radius:50%;opacity:.15;filter:blur(12px)}
.score-pct{font-size:34px;font-weight:900;line-height:1}
.score-label{font-size:12px;font-weight:600;opacity:.7;margin-top:4px}
.score-title{font-size:22px;font-weight:800;margin-bottom:8px}
.score-msg{font-size:14px;color:var(--gray);margin-bottom:2rem;line-height:1.6}
.stats-row{display:flex;gap:12px;margin:1.5rem 0}
.stat-box{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-val{font-size:26px;font-weight:800}
.stat-lbl{font-size:11px;color:var(--gray);margin-top:3px;font-weight:500}
.score-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:1.5rem}
.score-btn{border-radius:10px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;border:none}
.score-btn.primary{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}
.score-btn.primary:hover{opacity:.9;transform:translateY(-1px)}
.score-btn.ghost{background:rgba(255,255,255,.06);color:var(--gray);border:1px solid var(--border)}
.score-btn.ghost:hover{color:#fff;border-color:rgba(79,140,255,.4)}

/* ========== CONFETTI BURST ========== */
.confetti-piece{position:fixed;pointer-events:none;z-index:999;width:8px;height:8px;border-radius:2px;animation:confettiFall 1.2s ease-in forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(300px) rotate(720deg)}}

@media(max-width:600px){
  .app-header{padding:1rem}
  .subjects-nav,.subject-content,.quiz-wrap{padding:1rem}
  .mode-grid{grid-template-columns:1fr}
  .auto-row{flex-direction:column}
}
</style>
</head>
<body>

<!-- Animated background -->
<div class="bg-anim">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="grid-lines"></div>
</div>

<!-- ===== WELCOME SCREEN ===== -->
<div id="welcome-screen" class="screen">
  <div class="stars" id="stars"></div>
  <div class="welcome-badge">
    <span></span>
    Révision Brevet · 5ème → 3ème
  </div>
  <h1 class="welcome-title">
    <div class="glow-sub">Bienvenue sur</div>
    <span class="glow-text">BrevApp</span>
  </h1>
  <p class="welcome-desc">
    Révise toutes tes matières du brevet avec des quiz interactifs, des explications claires et des conseils après chaque question.
  </p>
  <button class="enter-btn" onclick="enterApp()">
    🚀 Commencer la révision
  </button>
</div>

<!-- ===== APP SCREEN ===== -->
<div id="app-screen">
  <div class="app-header">
    <div class="app-logo">📚</div>
    <div>
      <div class="app-title">BrevApp</div>
      <div class="app-subtitle">5ème → 3ème</div>
    </div>
    <div class="header-score">
      <span id="header-info" style="color:var(--gray);font-size:13px">Choisis une matière</span>
    </div>
  </div>

  <!-- Subject Tabs -->
  <div id="tabs-section">
    <div class="subjects-nav">
      <h2>Matières</h2>
      <div class="tabs-row" id="tabs-row"></div>
    </div>
    <div class="tab-divider"></div>
    <div class="subject-content" id="subject-content"></div>
  </div>

  <!-- Quiz section -->
  <div id="quiz-section" style="display:none">
    <div class="quiz-wrap" id="quiz-wrap"></div>
  </div>

  <!-- Score section -->
  <div id="score-section" style="display:none">
    <div class="score-wrap" id="score-wrap"></div>
  </div>
</div>

<script>
// ---- Stars ----
const starsEl=document.getElementById('stars');
for(let i=0;i<80;i++){
  const s=document.createElement('div');s.className='star';
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;--op:${.3+Math.random()*.7}`;
  starsEl.appendChild(s);
}

function enterApp(){
  document.getElementById('welcome-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  renderTabs();
  showSubject('math');
}

// ---- DATA ----
const SUBJECTS=[
  {id:'math',name:'Maths',emoji:'📐',color:'#1e2a5a',accent:'#4f8cff',desc:'Pythagore, Thalès, trigonométrie, algèbre, fonctions...'},
  {id:'french',name:'Français',emoji:'📝',color:'#1a2d1a',accent:'#22d48a',desc:'Grammaire, conjugaison, figures de style, rédaction...'},
  {id:'histoire',name:'Histoire',emoji:'🏛️',color:'#2d1a1a',accent:'#ff7e5a',desc:'Guerres mondiales, Révolution, guerre froide...'},
  {id:'geo',name:'Géographie',emoji:'🌍',color:'#0e2233',accent:'#38bdf8',desc:'Mondialisation, IDH, territoires, développement durable...'},
  {id:'svt',name:'SVT',emoji:'🧬',color:'#162213',accent:'#86efac',desc:'Génétique, évolution, corps humain, écosystèmes...'},
  {id:'physique',name:'Physique-Chimie',emoji:'⚗️',color:'#1e0e2d',accent:'#c084fc',desc:'Lumière, forces, loi d\'Ohm, réactions chimiques...'},
  {id:'emc',name:'EMC',emoji:'⚖️',color:'#2a1e00',accent:'#fbbf24',desc:'Citoyenneté, institutions, droits fondamentaux, laïcité...'},
];

const QUESTIONS={
math:[
  // AUTOMATISMES
  {type:'auto',cat:'Automatisme',q:'Calcule : 7² − 5²',a:'24',hint:'7²=49, 5²=25 → 49−25=24',explain:'On calcule les carrés séparément, puis on soustrait.',tip:'Retiens : a²−b² = (a+b)(a−b). Ici (7+5)(7−5)=12×2=24 !',example:'6²−4² = 36−16 = 20'},
  {type:'auto',cat:'Automatisme',q:'Simplifie la fraction : 24/36',a:'2/3',hint:'PGCD(24,36)=12 → 24÷12=2, 36÷12=3',explain:'Pour simplifier, on divise le numérateur et le dénominateur par leur PGCD.',tip:'Astuce : si les deux nombres sont pairs, divise par 2 jusqu\'à ce qu\'ils ne le soient plus.',example:'18/27 → PGCD=9 → 2/3'},
  {type:'auto',cat:'Automatisme',q:'Résous : 4x + 8 = 28',a:'x=5',hint:'4x = 28−8 = 20 → x = 20÷4',explain:'Pour résoudre une équation, on isole x en effectuant la même opération des deux côtés.',tip:'Toujours vérifier : 4×5+8 = 20+8 = 28 ✓',example:'3x + 6 = 21 → 3x = 15 → x = 5'},
  {type:'auto',cat:'Automatisme',q:'Calcule : (−4) × 7',a:'-28',hint:'(−) × (+) = (−)',explain:'Un nombre négatif multiplié par un positif donne un nombre négatif.',tip:'Règle des signes : (−)×(−)=(+) et (−)×(+)=(−)',example:'(−3)×8 = −24 ; (−5)×(−4) = +20'},
  {type:'auto',cat:'Automatisme',q:'Calcule : √196',a:'14',hint:'14 × 14 = 196',explain:'La racine carrée de 196 est 14, car 14²=196.',tip:'Connais tes carrés par cœur : 12²=144, 13²=169, 14²=196, 15²=225',example:'√225=15, √169=13'},
  {type:'auto',cat:'Automatisme',q:'Quel est le PGCD de 16 et 24 ?',a:'8',hint:'16=2⁴, 24=2³×3 → PGCD=2³=8',explain:'Le PGCD est le plus grand entier qui divise les deux nombres.',tip:'Méthode : liste les diviseurs ou utilise la décomposition en facteurs premiers.',example:'PGCD(20,30)=10 car 20=2×10, 30=3×10'},
  {type:'auto',cat:'Automatisme',q:'Calcule 20% de 350',a:'70',hint:'20% = 20÷100 = 0.2 → 0.2×350',explain:'Pour calculer un pourcentage, on multiplie par le taux divisé par 100.',tip:'Astuce rapide : 20% = 2×10%. 10% de 350 = 35, donc 20% = 70.',example:'15% de 200 = 0.15×200 = 30'},
  {type:'auto',cat:'Automatisme',q:'Convertis 3.2 km en mètres',a:'3200',hint:'1 km = 1000 m → 3.2 × 1000',explain:'Pour passer des km aux m, on multiplie par 1000.',tip:'Conversions à maîtriser : ×1000 pour km→m, ×100 pour m→cm, ×10 pour cm→mm',example:'0.75 km = 750 m ; 4.5 km = 4500 m'},
  {type:'auto',cat:'Automatisme',q:'Calcule l\'aire d\'un rectangle : 9 cm × 7 cm',a:'63',hint:'Aire = longueur × largeur',explain:'L\'aire d\'un rectangle = longueur × largeur = 9 × 7 = 63 cm².',tip:'Ne confonds pas l\'aire (surface en cm²) avec le périmètre (contour en cm).',example:'Périmètre = 2×(9+7) = 32 cm ; Aire = 9×7 = 63 cm²'},
  {type:'auto',cat:'Automatisme',q:'Calcule : 2⁵',a:'32',hint:'2×2×2×2×2',explain:'2⁵ = 2 multiplié 5 fois par lui-même = 32.',tip:'Puissances de 2 à connaître : 2¹=2, 2²=4, 2³=8, 2⁴=16, 2⁵=32, 2⁶=64',example:'3⁴ = 81 ; 5³ = 125'},
  // QCM
  {type:'mcq',cat:'Pythagore',q:'Triangle rectangle en A avec AB=6 cm et AC=8 cm. Quelle est BC ?',opts:['10 cm','14 cm','7 cm','48 cm'],ans:0,
  explain:'Pythagore : BC² = AB² + AC² = 36 + 64 = 100 → BC = 10 cm',
  tip:'Le triplet (6,8,10) est un multiple du triplet classique (3,4,5). Retiens-les !',
  correction:'BC² = 6² + 8² = 36 + 64 = 100 → BC = √100 = 10 cm',
  example:'Autres triplets : (5,12,13), (8,15,17), (7,24,25)'},
  {type:'mcq',cat:'Réciproque de Pythagore',q:'Un triangle a des côtés 9, 40 et 41. Est-il rectangle ?',opts:['Oui, car 9²+40²=41²','Non','Oui, car 9+40=49','On ne peut pas savoir'],ans:0,
  explain:'9²+40² = 81+1600 = 1681 = 41². La réciproque confirme que le triangle est rectangle !',
  tip:'Pour vérifier si un triangle est rectangle : calcule a²+b² et compare à c² (c = plus grand côté).',
  correction:'9²=81, 40²=1600, 41²=1681. Et 81+1600=1681 → OUI rectangle.',
  example:'(5,12,13) : 25+144=169=13² ✓'},
  {type:'mcq',cat:'Théorème de Thalès',q:'DE ∥ BC, AD=5, AB=8, AE=6. Quelle est AC ?',opts:['9.6','12','4','6.4'],ans:0,
  explain:'Par Thalès : AD/AB = AE/AC → 5/8 = 6/AC → AC = 6×8/5 = 9.6',
  tip:'Thalès : les rapports sont toujours égaux. Identifie d\'abord les triangles semblables.',
  correction:'5/8 = 6/AC → AC = 48/5 = 9.6',
  example:'Si AD/AB = AE/AC, alors aussi AD/DB = AE/EC'},
  {type:'mcq',cat:'Trigonométrie',q:'Dans un triangle rectangle, cos(angle) = ?',opts:['Adjacent / Hypoténuse','Opposé / Hypoténuse','Opposé / Adjacent','Hypoténuse / Adjacent'],ans:0,
  explain:'SOH-CAH-TOA : Sin=Opposé/Hyp, Cos=Adjacent/Hyp, Tan=Opposé/Adjacent',
  tip:'Mémo : SOH-CAH-TOA. Récite-le jusqu\'à le connaître par cœur !',
  correction:'Cos = Côté Adjacent / Hypoténuse (le côté "à côté" de l\'angle sur l\'hypoténuse)',
  example:'Angle 60° : cos(60°)=0.5. Si hyp=10, adjacent=5'},
  {type:'mcq',cat:'Trigonométrie',q:'Dans un triangle rectangle, angle=40°, hypoténuse=15 cm. Le côté opposé vaut ?',opts:['9.64 cm','11.49 cm','17.9 cm','7.5 cm'],ans:0,
  explain:'sin(40°) = opposé/15 → opposé = 15 × sin(40°) ≈ 15 × 0.643 ≈ 9.64 cm',
  tip:'Identifie d\'abord : quels côtés tu connais et cherches → choisis sin, cos ou tan.',
  correction:'Angle donné + hypoténuse connue + cherche opposé → utilise sin. sin(40°)×15≈9.64',
  example:'Avec angle=30°, hyp=20 : opposé = 20×sin(30°) = 20×0.5 = 10 cm'},
  {type:'mcq',cat:'Algèbre',q:'Développe et réduis : (2x+3)(x−4)',opts:['2x²−5x−12','2x²+5x−12','2x²−5x+12','2x²−12'],ans:0,
  explain:'Double distributivité : 2x×x + 2x×(−4) + 3×x + 3×(−4) = 2x²−8x+3x−12 = 2x²−5x−12',
  tip:'Méthode FOIL : First (2x×x), Outer (2x×−4), Inner (3×x), Last (3×−4)',
  correction:'2x²−8x+3x−12 = 2x²+(−8+3)x−12 = 2x²−5x−12',
  example:'(x+2)(x+3) = x²+5x+6 ; (x−1)(x+5) = x²+4x−5'},
  {type:'mcq',cat:'Identités remarquables',q:'Développe : (3x−2)²',opts:['9x²−12x+4','9x²+4','9x²−4','9x²+12x+4'],ans:0,
  explain:'(a−b)² = a²−2ab+b². Ici a=3x, b=2 → 9x²−12x+4',
  tip:'Les 3 identités : (a+b)²=a²+2ab+b², (a-b)²=a²-2ab+b², (a+b)(a-b)=a²-b²',
  correction:'(3x)²−2×3x×2+2² = 9x²−12x+4',
  example:'(x+5)²=x²+10x+25 ; (2x−1)²=4x²−4x+1'},
  {type:'mcq',cat:'Probabilités',q:'Un sac : 4 billes rouges, 3 bleues, 3 vertes. P(bleue) = ?',opts:['3/10','1/3','3/7','3/4'],ans:0,
  explain:'P(bleue) = 3/(4+3+3) = 3/10 = 0.3',
  tip:'Probabilité = nombre de cas favorables / nombre de cas total. Toujours vérifier que la somme = 1.',
  correction:'Total = 4+3+3 = 10. P(bleue) = 3/10',
  example:'P(rouge)=4/10, P(verte)=3/10. Vérif : 4/10+3/10+3/10=10/10=1 ✓'},
  {type:'mcq',cat:'Statistiques',q:'Moyenne de la série : 4, 8, 6, 12, 10',opts:['8','6','10','7'],ans:0,
  explain:'Moyenne = somme / effectif = (4+8+6+12+10)/5 = 40/5 = 8',
  tip:'Moyenne = on additionne tout, on divise par le nombre de valeurs. Ne pas confondre avec la médiane !',
  correction:'4+8+6+12+10 = 40. 40÷5 = 8',
  example:'Médiane de cette série : rangées [4,6,8,10,12] → médiane = 8 (valeur du milieu)'},
  {type:'mcq',cat:'Fonctions',q:'f(x) = x² − 3x + 2. Quelle est f(3) ?',opts:['2','4','8','0'],ans:0,
  explain:'f(3) = 3²−3×3+2 = 9−9+2 = 2',
  tip:'Pour calculer f(a), remplace CHAQUE x par a dans la formule.',
  correction:'f(3) = 9−9+2 = 2',
  example:'f(0)=2, f(1)=0, f(2)=0 → les racines sont x=1 et x=2 !'},
  {type:'mcq',cat:'Géométrie',q:'Volume d\'un cylindre de rayon 5 cm et hauteur 12 cm ?',opts:['300π cm³','60π cm³','120π cm³','25π cm³'],ans:0,
  explain:'Volume cylindre = πr²h = π×25×12 = 300π ≈ 942 cm³',
  tip:'Retiens les formules : cube=a³, parallélépipède=lLh, cylindre=πr²h, cône=(1/3)πr²h, sphère=(4/3)πr³',
  correction:'V = π×5²×12 = π×25×12 = 300π cm³',
  example:'Rayon 3, hauteur 10 : V = 9π×10 = 90π ≈ 283 cm³'},
],

french:[
  {type:'mcq',cat:'Grammaire — Nature des mots',q:'Dans "Le chien aboie bruyamment", quel est le rôle de "bruyamment" ?',opts:['Adverbe de manière','Adjectif qualificatif','Complément d\'objet','Sujet'],ans:0,
  explain:'"Bruyamment" modifie le verbe "aboie" → c\'est un adverbe de manière. Les adverbes sont invariables.',
  tip:'Les adverbes se terminent souvent en -ment. Ils modifient un verbe, un adjectif ou un autre adverbe.',
  correction:'"aboie" (verbe) + "bruyamment" (comment ?) → adverbe de manière',
  example:'"Il court rapidement" → rapidement = adverbe. "Elle est très belle" → très = adverbe d\'intensité'},
  {type:'mcq',cat:'Grammaire — Fonctions',q:'Quel est le COI dans : "Elle pense à ses vacances" ?',opts:['À ses vacances','Elle','Pense','Ses vacances'],ans:0,
  explain:'COI = Complément d\'Objet Indirect. Il répond à "à quoi ?" ou "de quoi ?" après le verbe. Ici : "pense à quoi ?" → à ses vacances.',
  tip:'COD = répond à "quoi?" directement. COI = répond à "à quoi?" ou "de quoi?" (avec préposition).',
  correction:'"pense À quoi ?" → à ses vacances = COI (avec préposition "à")',
  example:'"Je parle à mon ami" → à mon ami = COI. "Je mange une pomme" → une pomme = COD'},
  {type:'mcq',cat:'Conjugaison',q:'"Nous eûmes chanté" est à quel temps ?',opts:['Passé antérieur','Plus-que-parfait','Passé simple','Conditionnel passé'],ans:0,
  explain:'Passé antérieur = auxiliaire au passé simple + participe passé. Employé dans les subordonnées temporelles.',
  tip:'Passé antérieur → toujours accompagné d\'une proposition principale au passé simple.',
  correction:'"eûmes" = passé simple de "avoir" + "chanté" (participe passé) = passé antérieur',
  example:'"Quand il eut fini, il sortit" → "eut fini" = passé antérieur, "sortit" = passé simple'},
  {type:'mcq',cat:'Figures de style',q:'Quelle figure est : "La lune souriait doucement" ?',opts:['Personnification','Hyperbole','Métaphore','Comparaison'],ans:0,
  explain:'Personnification = on attribue des caractéristiques humaines à une chose ou un animal. "Sourire" est une action humaine attribuée à la lune.',
  tip:'Personnification : un objet fait une action humaine. Métaphore : on compare sans "comme".',
  correction:'"sourire" est une action humaine → attribuée à "la lune" (objet) → personnification',
  example:'"Le vent hurlait", "La mer furieuse avalait les bateaux" → personnifications'},
  {type:'mcq',cat:'Figures de style',q:'Quelle figure est : "Je suis mort de fatigue" ?',opts:['Hyperbole','Métaphore','Litote','Oxymore'],ans:0,
  explain:'Hyperbole = exagération intentionnelle pour produire un effet fort. "Mort de fatigue" exagère l\'état de fatigue.',
  tip:'Hyperbole = exagérer. Litote = dire moins pour signifier plus ("Ce n\'est pas mal" = c\'est bien).',
  correction:'"mort de fatigue" = exagération → hyperbole',
  example:'"Je t\'ai dit mille fois !", "Il court aussi vite que l\'éclair" → hyperboles'},
  {type:'mcq',cat:'Rédaction — Développement construit',q:'Dans une rédaction argumentative, à quoi sert l\'introduction ?',opts:['Présenter le sujet et annoncer le plan','Donner tous les arguments','Conclure la démonstration','Citer des exemples'],ans:0,
  explain:'L\'introduction : 1. accroche le lecteur, 2. présente le sujet/contexte, 3. formule la problématique, 4. annonce le plan.',
  tip:'Mémo intro : Accroche → Contexte → Problématique → Annonce du plan',
  correction:'L\'introduction ne donne pas d\'arguments, elle prépare le lecteur à la démonstration.',
  example:'"Nous verrons dans un premier temps... puis dans un second temps..."'},
  {type:'mcq',cat:'Orthographe',q:'Accord correct : "Les robes que j\'ai ___" (acheter)',opts:['Achetées','Acheté','Achetés','Acheté(e)s'],ans:0,
  explain:'COD avant le verbe avec avoir → accord du PP. "que" = "les robes" (féminin pluriel) placé AVANT "ai acheté" → achetées.',
  tip:'Règle PP avec avoir : si COD est AVANT le verbe → accord. Si COD est APRÈS → pas d\'accord.',
  correction:'"que" (=les robes, fém. plur.) est placé avant le verbe → achetées (fém. plur.)',
  example:'"Les fruits que j\'ai mangés" ✓ / "J\'ai mangé des fruits" (pas d\'accord) ✓'},
  {type:'mcq',cat:'Types de textes',q:'Quel procédé rend un texte descriptif plus vivant ?',opts:['Les figures de style (métaphores, comparaisons...)','Les chiffres et statistiques','La conjugaison au passé simple','Les dialogues uniquement'],ans:0,
  explain:'Les figures de style enrichissent la description et permettent au lecteur de mieux visualiser la scène. Elles rendent le texte plus expressif.',
  tip:'Dans une description : utilise les 5 sens (vue, ouïe, odorat, toucher, goût) + figures de style.',
  correction:'Un texte descriptif s\'enrichit grâce aux comparaisons, métaphores, hyperboles...',
  example:'"La mer était bleue" (plat) vs "La mer brillait comme un immense miroir de saphir" (vivant)'},
  {type:'mcq',cat:'Lecture analytique',q:'Qu\'est-ce qu\'un roman de formation (Bildungsroman) ?',opts:['Roman où le héros évolue et grandit au fil de l\'histoire','Roman historique','Roman policier','Roman fantastique'],ans:0,
  explain:'Le roman de formation (Bildungsroman) suit l\'évolution d\'un jeune personnage qui grandit, apprend et se construit une identité.',
  tip:'Exemples classiques à connaître : Candide (Voltaire), Émile ou De l\'éducation (Rousseau).',
  correction:'Bildungsroman = roman de "formation" ou d\'apprentissage. Le héros mûrit au fil du récit.',
  example:'"Candide" de Voltaire, "Oliver Twist" de Dickens → héros qui grandissent'},
  {type:'mcq',cat:'Poésie',q:'Qu\'est-ce qu\'une rime embrassée ?',opts:['Schéma ABBA','Schéma ABAB','Schéma AABB','Schéma AAAA'],ans:0,
  explain:'Rimes embrassées : ABBA (la rime extérieure "embrasse" la rime intérieure). Rimes croisées : ABAB. Rimes suivies : AABB.',
  tip:'Mémo : Em-bras-sée = les rimes s\'embrassent (s\'entourent) → ABBA',
  correction:'ABBA : vers 1 et 4 riment (A), vers 2 et 3 riment (B) → les A "embrassent" les B',
  example:'"Je suis venu calme orphelin..." (Verlaine) → ABBA'},
],

histoire:[
  {type:'mcq',cat:'1ère Guerre Mondiale',q:'Quel événement déclenche directement la Première Guerre Mondiale ?',opts:['L\'assassinat de l\'archiduc François-Ferdinand à Sarajevo','La déclaration de guerre de la France','L\'invasion de la Belgique','La bataille de Verdun'],ans:0,
  explain:'Le 28 juin 1914 : l\'archiduc François-Ferdinand (héritier d\'Autriche-Hongrie) est assassiné à Sarajevo par Gavrilo Princip (nationaliste serbe). Le jeu des alliances entraîne toute l\'Europe dans la guerre.',
  tip:'Retiens la chaîne : assassinat → Autriche vs Serbie → jeu d\'alliances → guerre mondiale',
  correction:'L\'assassinat de Sarajevo (28 juin 1914) → déclaration guerre Autriche-Serbie → alliances → PGM',
  example:'Triple Alliance (Allemagne, Autriche, Italie) vs Triple Entente (France, Russie, Royaume-Uni)'},
  {type:'mcq',cat:'1ère Guerre Mondiale',q:'Qu\'est-ce que le "bilan humain" de la 1ère Guerre Mondiale ?',opts:['~18 millions de morts (soldats + civils)','~1 million de morts','~50 millions de morts','~5 millions de morts'],ans:0,
  explain:'La PGM = environ 10 millions de soldats tués + 8 millions de civils = ~18 millions de morts. Sans compter les blessés et mutilés ("gueules cassées").',
  tip:'PGM : 18 millions de morts. WW2 : 60-70 millions. Ces chiffres montrent l\'ampleur des deux conflits.',
  correction:'~18 millions de morts → conflit le plus meurtrier jusqu\'alors dans l\'histoire de l\'humanité',
  example:'"Les gueules cassées" = soldats défigurés. Les monuments aux morts dans chaque village français'},
  {type:'mcq',cat:'2ème Guerre Mondiale',q:'Qu\'est-ce que l\'Appel du 18 juin 1940 ?',opts:['Discours de De Gaulle à Londres refusant la défaite','La déclaration de guerre de la France','L\'armistice signé par Pétain','Le débarquement en Normandie'],ans:0,

  tip:'18 juin 1940 = date clé ! De Gaulle dit NON à la défaite et OUI à la résistance.',
  correction:'De Gaulle à Londres, BBC, 18 juin 1940 → "La France a perdu une bataille ! Mais la France n\'a pas perdu la guerre !"',
  example:'Résistance intérieure (Jean Moulin, maquis) + France Libre (De Gaulle, FFL) = deux formes de résistance'},
  {type:'mcq',cat:'2ème Guerre Mondiale',q:'Quand et où sont lancées les bombes atomiques américaines ?',opts:['Hiroshima (6 août) et Nagasaki (9 août) 1945','Tokyo 1945','Hiroshima et Berlin 1945','Nagasaki 1944'],ans:0,
  explain:'Les USA larguent 2 bombes atomiques : "Little Boy" sur Hiroshima le 6 août 1945 et "Fat Man" sur Nagasaki le 9 août. Le Japon capitule le 15 août → fin de la WW2.',
  tip:'Retiens : 6 août = Hiroshima, 9 août = Nagasaki, 15 août = capitulation japonaise',
  correction:'Hiroshima 6/08/1945 : ~140 000 morts. Nagasaki 9/08/1945 : ~70 000 morts → fin WW2',
  example:'Ces bombes ouvrent l\'ère nucléaire et la course aux armements de la Guerre Froide'},
  {type:'mcq',cat:'Révolution française',q:'Que proclame la DDHC du 26 août 1789 ?',opts:['Les droits naturels et imprescriptibles de l\'homme : liberté, propriété, sûreté','La fin de la monarchie','La création de la République','La condamnation du roi'],ans:0,
  explain:'La Déclaration des Droits de l\'Homme et du Citoyen (DDHC) proclame les droits fondamentaux. Art.1 : "Les hommes naissent libres et égaux en droits." Elle inspire encore nos constitutions.',
  tip:'DDHC = 17 articles. Valeurs : Liberté, Égalité, Sûreté, Résistance à l\'oppression.',
  correction:'La DDHC ne met pas fin à la monarchie (Louis XVI règne encore jusqu\'en 1792)',
  example:'Article 4 : "La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui"'},
  {type:'mcq',cat:'20e siècle',q:'Quelle est la doctrine Truman (1947) ?',opts:['Les USA s\'engagent à aider tout pays menacé par le communisme','Accord de paix entre USA et URSS','La création de l\'ONU','Le plan Marshall'],ans:0,
  explain:'Doctrine Truman (mars 1947) : les USA acceptent d\'aider militairement et économiquement tout pays menacé par le communisme. Début officiel de la Guerre Froide.',
  tip:'Doctrine Truman + Plan Marshall = deux piliers de la politique anti-soviétique américaine en 1947',
  correction:'La doctrine Truman et le Plan Marshall sont deux choses différentes mais complémentaires',
  example:'Plan Marshall = aide économique à l\'Europe (13 milliards $). Doctrine Truman = aide politique/militaire'},
  {type:'mcq',cat:'20e siècle',q:'Qu\'est-ce que la décolonisation ?',opts:['Processus par lequel les colonies accèdent à l\'indépendance (1945-1975)','La colonisation de l\'Afrique','La création d\'empires coloniaux','Le retour des colons en Europe'],ans:0,
  explain:'Après 1945 : vague de décolonisation. Les peuples colonisés réclament l\'indépendance (ONU, nationalisme, affaiblissement des métropoles après la WW2). Décolonisation violente (Algérie) ou pacifique (Inde).',
  tip:'Décolonisation pacifique : Inde (Gandhi, 1947). Violente : Algérie (1954-1962), Vietnam (1954).',
  correction:'La décolonisation = gain d\'indépendance ≠ colonisation (conquête)',
  example:'Algérie : guerre d\'indépendance 1954-1962. Inde : indépendance 1947 sous Gandhi (non-violence)'},
  {type:'mcq',cat:'Histoire des arts',q:'Pourquoi le mémorial de la Shoah est-il important ?',opts:['Il commémore les 6 millions de Juifs assassinés par les nazis et transmet la mémoire','C\'est un musée d\'histoire militaire','Il célèbre la victoire des Alliés','Il honore la Résistance française'],ans:0,
  explain:'Le mémorial de la Shoah (Paris) conserve les archives, transmet la mémoire des victimes et éduque contre l\'antisémitisme et les génocides. Le Devoir de mémoire est essentiel pour "Plus jamais ça".',

  correction:'Le mémorial de la Shoah commémore le génocide juif, pas la victoire militaire',
  example:'Musée de l\'Holocauste à Washington, Yad Vashem à Jérusalem → mémoriaux similaires'},
],

geo:[
  {type:'mcq',cat:'Mondialisation',q:'Qu\'est-ce qu\'un Centre d\'Impulsion Mondial (CIM) ?',opts:['Métropole concentrant pouvoir financier, décisionnel et culturel mondial','Une usine de production','Une organisation internationale','Un port commercial'],ans:0,
  explain:'Les CIM (New York, Londres, Tokyo, Paris...) concentrent les sièges des FTN, les bourses mondiales, les centres culturels. Ils "pilotent" l\'économie mondiale.',

  correction:'CIM ≠ simple grande ville : c\'est une ville qui concentre POUVOIR et DÉCISION à l\'échelle mondiale',
  example:'New York : Wall Street + ONU + FTN + médias → CIM par excellence'},
  {type:'mcq',cat:'Développement',q:'Qu\'est-ce que l\'espérance de vie à la naissance ?',opts:['Durée de vie moyenne estimée d\'un individu dans un pays donné','Le nombre de naissances par an','L\'âge moyen de la population','La durée de scolarisation'],ans:0,

  tip:'Plus un pays est développé → meilleure santé → espérance de vie plus élevée.',

  example:'Japon : ~84 ans (record mondial). Sierra Leone : ~54 ans. France : ~82 ans'},
  {type:'mcq',cat:'Environnement',q:'Qu\'est-ce que l\'effet de serre naturel ?',opts:['Les gaz atmosphériques retiennent la chaleur du soleil, rendant la Terre habitable','La destruction de la couche d\'ozone','Le réchauffement climatique uniquement','La pollution industrielle'],ans:0,
  explain:'L\'effet de serre NATUREL est indispensable à la vie : il maintient la température moyenne de la Terre à +15°C (sans lui : −18°C). Le problème = l\'AMPLIFICATION par les activités humaines.',

  example:'GES (gaz à effet de serre) : CO₂, méthane, vapeur d\'eau. CO₂ augmente à cause de l\'industrie/transports'},
  {type:'mcq',cat:'Population',q:'Qu\'est-ce que la transition démographique ?',opts:['Passage d\'une forte natalité/mortalité à une faible natalité/mortalité','L\'explosion démographique permanente','La diminution de la population','L\'urbanisation rapide'],ans:0,
  explain:'Transition démographique : d\'abord mortalité baisse (progrès médical) → fort accroissement. Puis natalité baisse (développement, éducation) → stabilisation. Tous les pays passent par là.',
  tip:'Phase 1 : forte natal. + forte mort. = stable. Phase 2 : mort. baisse = boom. Phase 3 : natal. baisse = stable.',

let activeSubject='math',currentMode=null,currentQs=[],currentIdx=0,score=0,answered=false;

function shuffle(arr){return[...arr].sort(()=>Math.random()-0.5)}

function renderTabs(){
  const row=document.getElementById('tabs-row');
  row.innerHTML='';
  SUBJECTS.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(s.id===activeSubject?' active':'');
    btn.innerHTML=`${s.emoji} ${s.name}`;
    btn.onclick=()=>showSubject(s.id);
    row.appendChild(btn);
  });
}

function showSubject(id){
  activeSubject=id;
  document.getElementById('tabs-section').style.display='block';
  document.getElementById('quiz-section').style.display='none';
  document.getElementById('score-section').style.display='none';
  renderTabs();
  const s=SUBJECTS.find(x=>x.id===id);
  const allQ=QUESTIONS[id]||[];
  const autoQ=allQ.filter(q=>q.type==='auto');
  const mcqQ=allQ.filter(q=>q.type==='mcq');
  document.getElementById('subject-content').innerHTML=`
    <div class="subject-header">
      <div class="subject-icon-big" style="background:${s.color}">${s.emoji}</div>
      <div class="subject-title-group">
        <h2>${s.name}</h2>
        <p>${s.desc}</p>
      </div>
    </div>
    <div class="mode-grid">
      ${id==='math'?`<div class="mode-card" onclick="startQuiz('${id}','auto')">
        <span class="mode-badge" style="background:rgba(79,140,255,.15);color:#a5c4ff">⚡ Calcul rapide</span>
        <h3>Automatismes</h3>
        <p>Calcule et réponds en direct — entraîne ta fluidité</p>
        <div class="q-count">${autoQ.length} exercices disponibles</div>
      </div>`:''}
      <div class="mode-card" onclick="startQuiz('${id}','mcq')">
        <span class="mode-badge" style="background:rgba(34,212,138,.12);color:#22d48a">🧠 QCM</span>
        <h3>Questions de cours</h3>
        <p>Questions à choix multiple avec explications + conseils</p>
        <div class="q-count">${mcqQ.length} questions disponibles</div>
      </div>
      <div class="mode-card" onclick="startQuiz('${id}','all')">
        <span class="mode-badge" style="background:rgba(251,191,36,.12);color:#fbbf24">🎯 Mixte</span>
        <h3>Entraînement complet</h3>
        <p>Mélange de tout — comme un vrai contrôle surprise</p>
        <div class="q-count">${allQ.length} questions au total</div>
      </div>
    </div>
  `;
}

function startQuiz(subj,mode){
  currentMode=mode;currentIdx=0;score=0;answered=false;
  let pool=QUESTIONS[subj]||[];
  if(mode==='auto')pool=pool.filter(q=>q.type==='auto');
  else if(mode==='mcq')pool=pool.filter(q=>q.type==='mcq');
  currentQs=shuffle(pool).slice(0,10);
  if(!currentQs.length){alert('Pas assez de questions !');return;}
  document.getElementById('tabs-section').style.display='none';
  document.getElementById('quiz-section').style.display='block';
  document.getElementById('score-section').style.display='none';
  renderQ();
}

function renderQ(){
  answered=false;
  const q=currentQs[currentIdx];
  const s=SUBJECTS.find(x=>x.id===activeSubject);
  const pct=Math.round((currentIdx/currentQs.length)*100);
  document.getElementById('quiz-wrap').innerHTML=`
    <button class="back-btn" onclick="showSubject('${activeSubject}')">← Quitter</button>
    <div class="progress-row"><span>${s.emoji} ${s.name} — ${q.cat}</span><span>${currentIdx+1} / ${currentQs.length}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${q.type==='auto'?buildAuto(q):buildMCQ(q)}
  `;
  if(q.type==='auto'){const i=document.getElementById('ai');if(i){i.focus();i.onkeydown=e=>{if(e.key==='Enter')submitAuto()};}}
}

function buildMCQ(q){
  return`<div class="q-card">
    <div class="q-cat">${q.cat}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">${q.opts.map((o,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})"><span class="opt-letter">${'ABCD'[i]}</span>${o}</button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
}

function buildAuto(q){
  return`<div class="q-card">
    <div class="q-cat">⚡ ${q.cat}</div>
    <div class="q-text">${q.q}</div>
    <div class="auto-row">
      <input class="auto-input" id="ai" type="text" placeholder="Tape ta réponse..."/>
      <button class="submit-btn" onclick="submitAuto()">Valider →</button>
    </div>
    <div id="fb"></div>
  </div>`;
}

function pick(idx){
  if(answered)return;answered=true;
  const q=currentQs[currentIdx];
  const ok=idx===q.ans;
  if(ok)score++;
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans)b.classList.add('correct');
    else if(i===idx&&!ok)b.classList.add('wrong');
  });
  showFeedback(ok,q);
}

function submitAuto(){
  if(answered)return;answered=true;
  const q=currentQs[currentIdx];
  const val=(document.getElementById('ai').value||'').trim().toLowerCase().replace(/\s/g,'');
  const correct=q.a.toLowerCase().replace(/\s/g,'');
  const ok=val===correct||val===correct.replace(/[^0-9.,]/g,'');
  if(ok)score++;
  document.getElementById('ai').disabled=true;
  showFeedback(ok,q);
}

function showFeedback(ok,q){
  const fb=document.getElementById('fb');
  const isAuto=q.type==='auto';
  fb.innerHTML=`
    <div class="feedback ${ok?'correct-fb':'wrong-fb'}">
      <div class="fb-head ${ok?'ok':'nope'}">
        <span class="fb-icon">${ok?'✅':'❌'}</span>
        ${ok?'Bonne réponse ! Excellent travail 🎉':'Pas cette fois... Voilà la correction 👇'}
        ${isAuto&&!ok?`<span style="font-size:13px;font-weight:500;margin-left:8px">Réponse : <strong>${q.a}</strong></span>`:''}
      </div>
      <div class="fb-section">
        <div class="fb-label">📖 Explication</div>
        <div class="fb-body">${q.explain}</div>
        ${q.hint?`<div class="math-box">${q.hint}</div>`:''}
      </div>
      ${ok?`<div class="fb-tip">
        <div class="fb-label">💡 Conseil pour aller plus loin</div>
        <div class="fb-body">${q.tip}</div>
      </div>`:`
      <div class="fb-correction">
        <div class="fb-label">🔧 Correction détaillée</div>
        <div class="fb-body">${q.correction||q.explain}</div>
      </div>
      <div class="fb-tip">
        <div class="fb-label">💡 Conseil pour retenir</div>
        <div class="fb-body">${q.tip}</div>
      </div>`}
      <div class="fb-example">
        <div class="fb-label">✏️ Exemple similaire</div>
        <div class="fb-body">${q.example}</div>
      </div>
    </div>
    <button class="next-btn" onclick="nextQ()">${currentIdx+1<currentQs.length?'Question suivante →':'Voir mon score 🏁'}</button>
  `;
}

function nextQ(){
  currentIdx++;
  if(currentIdx>=currentQs.length){showScore();return;}
  renderQ();
}

function showScore(){
  const s=SUBJECTS.find(x=>x.id===activeSubject);
  const pct=Math.round((score/currentQs.length)*100);
  const isGood=pct>=70,isMid=pct>=40;
  const col=isGood?'#22d48a':isMid?'#ffd76e':'#ff5a7e';
  const msg=pct>=90?'Parfait ! Tu maîtrises ce chapitre 🏆':pct>=70?'Très bien ! Encore un peu de révision 💪':pct>=50?'Courage ! Relis le cours et recommence 📚':'Il faut reprendre ce chapitre depuis le début 🔄';
  document.getElementById('quiz-section').style.display='none';
  document.getElementById('score-section').style.display='block';
  if(pct>=70)confetti();
  document.getElementById('score-wrap').innerHTML=`
    <h2 class="score-title">${s.emoji} ${s.name} — Résultats</h2>
    <div class="score-circle" style="border-color:${col};color:${col};background:${col}18">
      <span class="score-pct">${pct}%</span>
      <span class="score-label">${score}/${currentQs.length} correct</span>
    </div>
    <p class="score-msg">${msg}</p>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-val" style="color:#22d48a">${score}</div><div class="stat-lbl">✅ Bonnes réponses</div></div>
      <div class="stat-box"><div class="stat-val" style="color:#ff5a7e">${currentQs.length-score}</div><div class="stat-lbl">❌ Erreurs</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--accent)">${currentQs.length}</div><div class="stat-lbl">📊 Total</div></div>
    </div>
    <div class="score-actions">
      <button class="score-btn primary" onclick="startQuiz('${activeSubject}','${currentMode}')">🔄 Recommencer</button>
      <button class="score-btn ghost" onclick="showSubject('${activeSubject}')">Changer de mode</button>
      <button class="score-btn ghost" onclick="showSubject('${activeSubject}')">🏠 Accueil</button>
    </div>
  `;
}

function confetti(){
  const colors=['#4f8cff','#22d48a','#ffd76e','#ff5a7e','#a78bfa','#fff'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');p.className='confetti-piece';
    p.style.cssText=`left:${20+Math.random()*60}vw;top:30vh;background:${colors[Math.floor(Math.random()*colors.length)]};animation-delay:${Math.random()*0.5}s;animation-duration:${0.8+Math.random()*0.8}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2000);
  }
}
</script>
</body>
</html>
