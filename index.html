<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révision Brevet — 5ème → 3ème</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e5e5e5;padding:1rem 1.5rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{width:38px;height:38px;background:#534AB7;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.header h1{font-size:18px;font-weight:600;color:#1a1a1a}
.header .subtitle{font-size:13px;color:#888;margin-left:auto}
.screen{padding:1.5rem;max-width:900px;margin:0 auto}
.subjects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:1.5rem}
.subject-card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.25rem;cursor:pointer;transition:transform 0.15s,border-color 0.15s,box-shadow 0.15s}
.subject-card:hover{transform:translateY(-3px);border-color:#534AB7;box-shadow:0 4px 20px rgba(83,74,183,0.12)}
.subject-card .icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px}
.subject-card h3{font-size:15px;font-weight:600;margin-bottom:4px}
.subject-card p{font-size:12px;color:#888;line-height:1.5}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:14px;color:#888;margin-bottom:1.5rem}
.back-btn{background:#fff;border:1px solid #ddd;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;color:#1a1a1a;display:inline-flex;align-items:center;gap:6px;margin-bottom:1.25rem;transition:background 0.15s}
.back-btn:hover{background:#f5f5f5}
.mode-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:640px}
.mode-card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.25rem;cursor:pointer;transition:all 0.15s}
.mode-card:hover{border-color:#534AB7;box-shadow:0 2px 12px rgba(83,74,183,0.1)}
.mode-card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.mode-card p{font-size:12px;color:#888;line-height:1.5}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin-bottom:10px;font-weight:600}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:8px}
.progress-bar{background:#eee;border-radius:4px;height:7px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#534AB7,#7F77DD);border-radius:4px;transition:width 0.4s}
.question-card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.5rem;margin-bottom:1rem}
.question-type{font-size:11px;font-weight:700;color:#534AB7;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px}
.question-text{font-size:16px;font-weight:600;line-height:1.6;margin-bottom:1.5rem}
.options{display:flex;flex-direction:column;gap:9px}
.option-btn{background:#f8f8f8;border:1px solid #e5e5e5;border-radius:10px;padding:12px 16px;text-align:left;cursor:pointer;font-size:14px;color:#1a1a1a;transition:all 0.15s;display:flex;align-items:center;gap:12px}
.option-btn:hover:not(:disabled){border-color:#534AB7;background:#EEEDFE}
.option-btn.correct{border-color:#0F6E56!important;background:#E1F5EE!important;color:#085041!important;font-weight:600}
.option-btn.wrong{border-color:#993C1D!important;background:#FAECE7!important;color:#4A1B0C!important}
.option-btn:disabled{cursor:default}
.option-letter{width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all 0.15s}
.feedback-card{border-radius:12px;padding:1.25rem;margin-top:1rem}
.feedback-card.correct{background:#E1F5EE;border:1px solid #9FE1CB}
.feedback-card.wrong{background:#FAECE7;border:1px solid #F5C4B3}
.feedback-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.feedback-body{font-size:13px;line-height:1.7;color:#444}
.feedback-example{margin-top:10px;background:#fff;border-radius:8px;padding:10px 14px;font-size:13px;border-left:3px solid #534AB7;color:#333}
.math-display{font-family:monospace;font-size:15px;background:#f8f8f8;padding:8px 14px;border-radius:8px;margin:8px 0;text-align:center;color:#333;border:1px solid #eee}
.next-btn{width:100%;background:#534AB7;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-top:1rem;transition:background 0.15s}
.next-btn:hover{background:#3C3489}
.score-card{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:2.5rem;text-align:center;max-width:480px;margin:2rem auto}
.score-circle{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 1.5rem;border:4px solid}
.stats-row{display:flex;gap:12px;margin:1.5rem 0}
.stat-box{flex:1;background:#f8f8f8;border-radius:10px;padding:14px;text-align:center}
.stat-box .val{font-size:24px;font-weight:800}
.stat-box .lbl{font-size:11px;color:#888;margin-top:2px}
.restart-btn{background:#534AB7;color:#fff;border:none;border-radius:9px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;margin:5px;transition:background 0.15s}
.restart-btn:hover{background:#3C3489}
.restart-btn.outline{background:#fff;color:#534AB7;border:1.5px solid #534AB7}
.restart-btn.outline:hover{background:#EEEDFE}
.auto-input-field{background:#f8f8f8;border:1.5px solid #ddd;border-radius:10px;padding:10px 14px;font-size:16px;width:100%;color:#1a1a1a;transition:border-color 0.15s;font-family:inherit}
.auto-input-field:focus{outline:none;border-color:#534AB7;background:#fff}
.validate-btn{background:#534AB7;color:#fff;border:none;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s;white-space:nowrap}
.validate-btn:hover{background:#3C3489}
.quiz-container{max-width:680px}
@media(max-width:600px){
  .mode-cards{grid-template-columns:1fr}
  .stats-row{flex-direction:column}
  .screen{padding:1rem}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><i class="ti ti-school"></i></div>
  <div>
    <h1>Révision Brevet</h1>
  </div>
  <span class="subtitle">5ème → 3ème</span>
</div>

<div id="main-screen" class="screen">
  <div class="page-title">Choisir une matière</div>
  <div class="page-sub">Sélectionne une matière pour commencer tes révisions</div>
  <div class="subjects-grid" id="subjects-grid"></div>
</div>

<div id="subject-screen" class="screen" style="display:none"></div>
<div id="quiz-screen" class="screen" style="display:none"></div>
<div id="score-screen" class="screen" style="display:none"></div>

<script>
const SUBJECTS=[
  {id:'math',name:'Mathématiques',emoji:'📐',color:'#EEEDFE',text:'#3C3489',desc:'Pythagore, Thalès, trigonométrie, algèbre...'},
  {id:'french',name:'Français',emoji:'📝',color:'#E1F5EE',text:'#085041',desc:'Grammaire, rédaction, lecture analytique...'},
  {id:'histoire',name:'Histoire',emoji:'🏛️',color:'#FAECE7',text:'#4A1B0C',desc:'Guerres mondiales, révolutions, 20e siècle...'},
  {id:'geo',name:'Géographie',emoji:'🌍',color:'#E6F1FB',text:'#0C447C',desc:'Mondialisation, territoires, développement...'},
  {id:'svt',name:'SVT',emoji:'🧬',color:'#EAF3DE',text:'#27500A',desc:'Génétique, évolution, corps humain...'},
  {id:'physique',name:'Physique-Chimie',emoji:'⚗️',color:'#FBEAF0',text:'#4B1528',desc:'Lumière, forces, électricité, chimie...'},
  {id:'emc',name:'EMC',emoji:'⚖️',color:'#FAEEDA',text:'#412402',desc:'Citoyenneté, démocratie, droits fondamentaux...'},
];

const QUESTIONS={
math:[
  {type:'automatisme',q:'Calcule : 3² + 4²',a:'25',hint:'3²=9, 4²=16 → 9+16=25',explain:'On calcule chaque carré séparément puis on additionne.',example:'2² + 5² = 4 + 25 = 29'},
  {type:'automatisme',q:'Simplifie : 15/25',a:'3/5',hint:'Diviser par le PGCD = 5 : 15÷5=3, 25÷5=5',explain:'Pour simplifier une fraction, divise numérateur et dénominateur par leur PGCD.',example:'18/24 → PGCD=6 → 3/4'},
  {type:'automatisme',q:'Résous : 3x + 6 = 21',a:'x=5',hint:'3x = 21-6 = 15 → x = 15÷3',explain:'On isole x en effectuant les opérations inverses.',example:'2x + 4 = 12 → 2x = 8 → x = 4'},
  {type:'automatisme',q:'Calcule : (-3) × (-4)',a:'12',hint:'(−) × (−) = (+)',explain:'Le produit de deux nombres négatifs est positif.',example:'(-5) × (-2) = +10'},
  {type:'automatisme',q:'Quelle est la valeur de π arrondie au centième ?',a:'3.14',hint:'π ≈ 3.14159...',explain:'π est un nombre irrationnel. On utilise souvent 3.14 ou 22/7 comme approximation.',example:'Circonférence = 2πr → avec r=5 : C ≈ 31.4'},
  {type:'automatisme',q:'Calcule : √144',a:'12',hint:'12 × 12 = 144',explain:'La racine carrée d\'un nombre est le nombre qui, multiplié par lui-même, donne ce nombre.',example:'√25=5, √64=8, √100=10, √169=13'},
  {type:'automatisme',q:'Donne le résultat de : 2³',a:'8',hint:'2×2×2',explain:'2³ = 2 × 2 × 2 = 8. La puissance indique combien de fois on multiplie le nombre par lui-même.',example:'3³=27, 4³=64, 5²=25'},
  {type:'automatisme',q:'Quel est le PGCD de 12 et 18 ?',a:'6',hint:'Diviseurs de 12 : 1,2,3,4,6,12. Diviseurs de 18 : 1,2,3,6,9,18',explain:'Le PGCD (Plus Grand Commun Diviseur) est le plus grand entier qui divise les deux nombres.',example:'PGCD(20,30)=10 car 20=2×10 et 30=3×10'},
  {type:'automatisme',q:'Convertis 2.5 km en mètres',a:'2500',hint:'1 km = 1000 m → 2.5 × 1000',explain:'Pour convertir des km en m, on multiplie par 1000.',example:'3.7 km = 3700 m ; 0.5 km = 500 m'},
  {type:'automatisme',q:'Calcule 15% de 200',a:'30',hint:'15/100 × 200 = 0.15 × 200',explain:'Pour calculer un pourcentage : multiplier par le pourcentage divisé par 100.',example:'20% de 150 = 0.20 × 150 = 30'},
  {type:'automatisme',q:'Résous : 5x - 10 = 0',a:'x=2',hint:'5x = 10 → x = 10÷5',explain:'On isole x : 5x = 10 → x = 2.',example:'4x - 8 = 0 → 4x = 8 → x = 2'},
  {type:'automatisme',q:'Calcule l\'aire d\'un rectangle de 6cm × 4cm',a:'24',hint:'Aire = longueur × largeur',explain:'Aire rectangle = l × L = 6 × 4 = 24 cm²',example:'Rectangle 8×5 : A = 40 cm²'},
  {type:'mcq',cat:'Théorème de Pythagore',q:'Dans un triangle ABC rectangle en A, AB=3 cm et AC=4 cm. Quelle est la longueur de BC ?',opts:['5 cm','7 cm','12 cm','6 cm'],ans:0,explain:'BC² = AB² + AC² = 9 + 16 = 25 → BC = 5 cm. Le triplet (3,4,5) est le plus classique !',example:'Triangle 6-8-? : BC² = 36+64=100 → BC=10 cm'},
  {type:'mcq',cat:'Réciproque de Pythagore',q:'Un triangle a des côtés 5, 12 et 13. Est-il rectangle ?',opts:['Oui, car 5²+12²=13²','Non, les côtés ne conviennent pas','Oui, car 5+12=17','On ne peut pas savoir'],ans:0,explain:'5²+12² = 25+144 = 169 = 13². La réciproque de Pythagore confirme que ce triangle est rectangle.',example:'Triplets pythagoriciens : (3,4,5), (5,12,13), (6,8,10), (8,15,17)'},
  {type:'mcq',cat:'Théorème de Thalès',q:'Dans le triangle ABC, D sur AB et E sur AC, DE∥BC. Si AD=4, DB=2 et AE=6, quelle est EC ?',opts:['3','2','4','6'],ans:0,explain:'Par Thalès : AD/DB = AE/EC → 4/2 = 6/EC → EC = 6×2/4 = 3',example:'Méthode : identifier les segments parallèles, poser le rapport, résoudre.'},
  {type:'mcq',cat:'Trigonométrie',q:'Dans un triangle rectangle, sin(angle) = opposé / ?',opts:['Hypoténuse','Adjacent','Hypoténuse²','Opposé²'],ans:0,explain:'SOH-CAH-TOA : Sin=Opposé/Hypoténuse, Cos=Adjacent/Hypoténuse, Tan=Opposé/Adjacent',example:'Angle 30° : sin(30°)=0.5. Si hypoténuse=10, côté opposé=5'},
  {type:'mcq',cat:'Trigonométrie',q:'Un triangle rectangle a un angle de 35° et une hypoténuse de 10 cm. Quel est le côté opposé à 35° ?',opts:['5.74 cm','8.19 cm','7 cm','3.5 cm'],ans:0,explain:'sin(35°) = opposé/10 → opposé = 10×sin(35°) ≈ 5.74 cm',example:'Pour trouver un côté : identifier sin/cos/tan selon les côtés connus.'},
  {type:'mcq',cat:'Algèbre',q:"Résous : x² - 9 = 0",opts:['x=3 ou x=-3','x=9','x=3','x=0'],ans:0,explain:"x²=9 → x=3 ou x=-3. Une équation du 2e degré peut avoir 2 solutions !",example:'x²-25=0 → x=5 ou x=-5'},
  {type:'mcq',cat:'Algèbre',q:'Développe : (x+3)(x-2)',opts:['x²+x-6','x²-x-6','x²+x+6','x²-6'],ans:0,explain:'(x+3)(x-2) = x²-2x+3x-6 = x²+x-6 (double distributivité)',example:'(a+b)(c+d)=ac+ad+bc+bd. Mémo : FOIL'},
  {type:'mcq',cat:'Identités remarquables',q:"Laquelle est une identité remarquable correcte ?",opts:['(a+b)²=a²+2ab+b²','(a+b)²=a²+b²','(a-b)²=a²+b²','(a+b)(a-b)=a²+b²'],ans:0,explain:'Les 3 identités : (a+b)²=a²+2ab+b², (a-b)²=a²-2ab+b², (a+b)(a-b)=a²-b²',example:'(x+5)²=x²+10x+25'},
  {type:'mcq',cat:'Géométrie',q:"Quelle est l'aire d'un disque de rayon 7 cm ?",opts:['49π cm²','14π cm²','7π cm²','98π cm²'],ans:0,explain:"Aire = πr² = π×7² = 49π ≈ 153.94 cm²",example:"Rayon 5 : A=25π≈78.5 cm²"},
  {type:'mcq',cat:'Géométrie',q:'Le volume dune sphère de rayon r est :',opts:['(4/3)πr³','πr²h','(1/3)πr²h','2πr²'],ans:0,explain:'V=(4/3)πr³. Pour r=3 : V=36π≈113.1 cm³',example:'Rayon 6 : V=288π≈904.8 cm³'},
  {type:'mcq',cat:'Probabilités',q:'Urne : 3 rouges, 5 bleues, 2 vertes. Probabilité de tirer rouge ?',opts:['3/10','1/3','3/5','1/10'],ans:0,explain:'P(rouge)=3/10=0.3',example:'P(bleu)=5/10=1/2. Somme de toutes les probabilités = 1'},
  {type:'mcq',cat:'Statistiques',q:'La médiane de [2, 5, 7, 10, 14] est :',opts:['7','5','10','7.6'],ans:0,explain:'Médiane = valeur du milieu (3e sur 5) = 7',example:'[3,6,8,11,15] → médiane=8. Nb pair : moyenne des 2 du milieu'},
  {type:'mcq',cat:'Fonctions',q:'f(x)=2x+3. Quelle est f(4) ?',opts:['11','14','10','8'],ans:0,explain:'f(4)=2×4+3=11',example:'f(0)=3 (ordonnée à l\'origine)'},
  {type:'mcq',cat:'Fonctions',q:"La courbe de f(x)=ax passe toujours par :",opts:["L'origine (0,0)","(1,0)","(0,1)","(a,a)"],ans:0,explain:"f(0)=a×0=0 → passe par (0,0)",example:"f(x)=3x → passe par (0,0) et (1,3)"},
  {type:'mcq',cat:'Proportionnalité',q:"4 stylos coûtent 6€. Combien coûtent 10 stylos ?",opts:['15€','12€','14€','16€'],ans:0,explain:"Prix unitaire=1.50€ → 10×1.50=15€",example:"Règle de trois : 4→6€, 10→? = 10×6/4=15€"},
  {type:'mcq',cat:'Géométrie',q:'Quelle est la formule de la circonférence d\'un cercle ?',opts:['2πr','πr²','2πr²','πd²'],ans:0,explain:'Circonférence = 2πr = πd (d = diamètre = 2r)',example:'r=5 : C=2π×5=10π≈31.4 cm'},
  {type:'mcq',cat:'Nombres relatifs',q:'Calcule : -8 + 5 - (-3)',opts:['0','6','-6','10'],ans:0,explain:'-8+5-(-3)=-8+5+3=-8+8=0. Soustraire un négatif revient à ajouter.',example:'-10+4-(-6)=-10+4+6=0'},
  {type:'mcq',cat:'Fractions',q:'Calcule : 1/3 + 1/4',opts:['7/12','2/7','1/7','5/12'],ans:0,explain:'Dénominateur commun 12 : 4/12 + 3/12 = 7/12',example:'1/2+1/3 = 3/6+2/6 = 5/6'},
],

french:[
  {type:'mcq',cat:'Grammaire',q:'Quel est le COD dans : "Marie mange une pomme" ?',opts:['Une pomme','Marie','Mange','Aucun'],ans:0,explain:'COD : "Mange quoi ?" → une pomme. Réponse directe au verbe sans préposition.',example:'"Il lit un livre" → COD=un livre'},
  {type:'mcq',cat:'Conjugaison',q:'Quel est le temps de : "Nous avions mangé" ?',opts:['Plus-que-parfait','Imparfait','Passé composé','Passé simple'],ans:0,explain:'Auxiliaire à l\'imparfait + participe passé = plus-que-parfait.',example:'"Il était parti avant que j\'arrive" → était parti = plus-que-parfait'},
  {type:'mcq',cat:'Conjugaison',q:'"Je chantais" est à quel temps ?',opts:['Imparfait','Passé simple','Conditionnel','Présent'],ans:0,explain:'L\'imparfait exprime une action passée répétée, habituelle ou décrivant le contexte. Terminaison en -ais, -ais, -ait, -ions, -iez, -aient.',example:'"Quand j\'étais enfant, je jouais souvent dehors"'},
  {type:'mcq',cat:'Figures de style',q:'Quelle figure est : "Il pleut des cordes" ?',opts:['Hyperbole','Métaphore','Comparaison','Oxymore'],ans:0,explain:"L'hyperbole = exagération pour effet. \"Des cordes\" exagère l'intensité.",example:'"Je meurs de faim", "Il court comme le vent"'},
  {type:'mcq',cat:'Figures de style',q:'"La lune est un astre d\'argent" — quelle figure ?',opts:['Métaphore','Comparaison','Allitération','Personnification'],ans:0,explain:'Métaphore : assimile directement sans "comme". Comparaison utiliserait "comme" ou "tel".',example:'Méta: "La vie est un voyage". Compar: "La vie est COMME un voyage"'},
  {type:'mcq',cat:'Figures de style',q:'Qu\'est-ce qu\'un oxymore ?',opts:['Association de deux termes contradictoires','Répétition d\'un son','Exagération','Comparaison sans outil'],ans:0,explain:'Oxymore = deux mots de sens opposés placés ensemble pour créer un effet poétique.',example:'"Cette obscure clarté" (Corneille), "un silence assourdissant"'},
  {type:'mcq',cat:'Types de textes',q:'Un texte argumentatif vise à :',opts:['Convaincre le lecteur','Raconter une histoire','Décrire un lieu','Expliquer un phénomène'],ans:0,explain:'Texte argumentatif : thèse + arguments + exemples pour convaincre.',example:'Structure : intro → 2-3 arguments → conclusion/réfutation'},
  {type:'mcq',cat:'Rédaction',q:'Quelle est la structure d\'un développement construit ?',opts:['Intro + 2-3 parties + conclusion','Seulement une intro','Un paragraphe de description','Aucune structure fixe'],ans:0,explain:'Développement construit = intro (pose le sujet) + parties (avec arguments+exemples) + conclusion (répond à la problématique).',example:'"Nous verrons d\'abord... puis... enfin..."'},
  {type:'mcq',cat:'Orthographe',q:'Accord du participe passé : "Les lettres que j\'ai ___ (écrire)"',opts:['Écrites','Écrit','Écrits','Écrite'],ans:0,explain:'Avec avoir, le PP s\'accorde avec le COD si celui-ci est AVANT le verbe. "que"=les lettres (fém. plur.) est avant → écrites.',example:'"La chanson que j\'ai chantée" → COD fém. avant → -e'},
  {type:'mcq',cat:'Lecture',q:'Qu\'est-ce qu\'un narrateur homodiégétique ?',opts:['Un narrateur qui participe à l\'histoire (je)','Un narrateur externe omniscient','Un personnage secondaire','Un narrateur invisible'],ans:0,explain:'Homodiégétique = présent dans l\'histoire, utilise "je". Hétérodiégétique = extérieur, utilise "il/elle".',example:'"Je marchais dans la rue..." = homo. "Paul marchait..." = hétéro'},
  {type:'mcq',cat:'Poésie',q:'Combien de syllabes a un alexandrin ?',opts:['12','8','10','14'],ans:0,explain:"L'alexandrin = vers de 12 syllabes, pilier de la poésie classique.",example:'"Je le vis, je rougis, je pâlis à sa vue" (Racine, Phèdre)'},
  {type:'mcq',cat:'Vocabulaire',q:'Quel est l\'antonyme de "bénévole" ?',opts:['Salarié','Volontaire','Altruiste','Généreux'],ans:0,explain:'Bénévole = travaille sans salaire, de façon volontaire. Antonyme = salarié (qui est payé).',example:'"Elle est bénévole dans une association" ≠ "Il est salarié dans une entreprise"'},
  {type:'mcq',cat:'Grammaire',q:'Quel est le sujet dans : "Pendant l\'orage, les enfants tremblaient" ?',opts:['Les enfants','L\'orage','Pendant','Tremblaient'],ans:0,explain:'Le sujet = celui/ce qui fait l\'action. "Qui est-ce qui tremblait ?" → les enfants.',example:'"La pluie tombe" → sujet = la pluie'},
  {type:'mcq',cat:'Conjugaison',q:'Au futur simple, "nous allons" devient :',opts:['Nous irons','Nous allerons','Nous ailerons','Nous allirons'],ans:0,explain:'Aller au futur est irrégulier : ir- (radical) + -ons = irons. Comme venir→viendrons, faire→ferons.',example:'Je irai, tu iras, il ira, nous irons, vous irez, ils iront'},

let currentSubject=null,currentMode=null,currentQs=[],currentIdx=0,score=0,answered=false;

function shuffle(arr){return[...arr].sort(()=>Math.random()-0.5)}

function getQuestions(subj,mode,n=12){
  let all=QUESTIONS[subj]||[];
  if(mode==='automatisme')all=all.filter(q=>q.type==='automatisme');
  else if(mode==='qcm')all=all.filter(q=>q.type==='mcq');
  return shuffle(all).slice(0,n);
}

function hide(id){document.getElementById(id).style.display='none'}
function show(id){document.getElementById(id).style.display='block'}

function showMain(){
  show('main-screen');hide('subject-screen');hide('quiz-screen');hide('score-screen');
}

function showSubject(subj){
  currentSubject=subj;
  const s=SUBJECTS.find(x=>x.id===subj);
  const sc=document.getElementById('subject-screen');
  sc.innerHTML=`
    <button class="back-btn" onclick="showMain()"><i class="ti ti-arrow-left"></i> Retour</button>
    <div class="page-title">${s.emoji} ${s.name}</div>
    <div class="page-sub">Choisis ton mode de révision</div>
    <div class="mode-cards">
      ${subj==='math'?`<div class="mode-card" onclick="startQuiz('${subj}','automatisme')">
        <span class="badge" style="background:#EEEDFE;color:#3C3489">⚡ Calcul rapide</span>
        <h3>Automatismes</h3>
        <p>Calculs rapides à saisir — entraîne ta fluidité de calcul</p>
      </div>`:''}
      <div class="mode-card" onclick="startQuiz('${subj}','qcm')">
        <span class="badge" style="background:#E1F5EE;color:#085041">🧠 QCM</span>
        <h3>Questions de cours</h3>
        <p>Questions à choix multiple avec explications détaillées</p>
      </div>
      <div class="mode-card" onclick="startQuiz('${subj}','all')">
        <span class="badge" style="background:#FAECE7;color:#4A1B0C">🎯 Entraînement</span>
        <h3>Mode mixte</h3>
        <p>Mélange de toutes les questions — comme un vrai contrôle</p>
      </div>
    </div>
  `;
  hide('main-screen');show('subject-screen');hide('quiz-screen');hide('score-screen');
}

function startQuiz(subj,mode){
  currentMode=mode;currentIdx=0;score=0;answered=false;
  currentQs=getQuestions(subj,mode);
  if(!currentQs.length){alert('Pas assez de questions pour ce mode !');return;}
  hide('subject-screen');show('quiz-screen');
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const q=currentQs[currentIdx];
  const s=SUBJECTS.find(x=>x.id===currentSubject);
  const pct=Math.round((currentIdx/currentQs.length)*100);
  let content=q.type==='automatisme'?renderAuto(q):renderMCQ(q);
  document.getElementById('quiz-screen').innerHTML=`
    <button class="back-btn" onclick="showSubject('${currentSubject}')"><i class="ti ti-arrow-left"></i> Quitter</button>
    <div class="quiz-container">
      <div class="progress-info"><span>${s.emoji} ${s.name}</span><span>Question ${currentIdx+1} / ${currentQs.length}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${content}
    </div>
  `;
  if(q.type==='automatisme'){
    const inp=document.getElementById('auto-ans');
    if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')submitAuto()};}
  }
}

function renderMCQ(q){
  return`<div class="question-card">
    <div class="question-type">${q.cat||'Question'}</div>
    <div class="question-text">${q.q}</div>
    <div class="options">${q.opts.map((o,i)=>`
      <button class="option-btn" id="opt-${i}" onclick="selectAnswer(${i})">
        <span class="option-letter">${'ABCD'[i]}</span>${o}
      </button>`).join('')}
    </div>
    <div id="feedback-area"></div>
  </div>`;
}

function renderAuto(q){
  return`<div class="question-card">
    <div class="question-type">⚡ Automatisme</div>
    <div class="question-text">${q.q}</div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:12px">
      <input class="auto-input-field" type="text" id="auto-ans" placeholder="Ta réponse..."/>
      <button class="validate-btn" onclick="submitAuto()">Valider</button>
    </div>
    <div id="feedback-area"></div>
  </div>`;
}

function submitAuto(){
  if(answered)return;
  const q=currentQs[currentIdx];
  const val=(document.getElementById('auto-ans').value||'').trim().toLowerCase().replace(/\s/g,'');
  const correct=q.a.toLowerCase().replace(/\s/g,'');
  const ok=val===correct||val===correct.replace(/[^0-9.]/g,'');
  answered=true;
  if(ok)score++;
  document.getElementById('auto-ans').disabled=true;
  showFeedback(ok,q);
}

function selectAnswer(idx){
  if(answered)return;
  answered=true;
  const q=currentQs[currentIdx];
  const ok=idx===q.ans;
  if(ok)score++;
  document.querySelectorAll('.option-btn').forEach((btn,i)=>{
    btn.disabled=true;
    if(i===q.ans)btn.classList.add('correct');
    else if(i===idx&&!ok)btn.classList.add('wrong');
  });
  showFeedback(ok,q);
}

function showFeedback(ok,q){
  document.getElementById('feedback-area').innerHTML=`
    <div class="feedback-card ${ok?'correct':'wrong'}" style="margin-top:1rem">
      <div class="feedback-title">
        <i class="ti ti-${ok?'circle-check':'circle-x'}" style="font-size:20px"></i>
        ${ok?'Bravo ! Bonne réponse 🎉':'Pas tout à fait...'}
        ${q.type==='automatisme'&&!ok?`<span style="font-size:13px;font-weight:400"> — Réponse : <strong>${q.a}</strong></span>`:''}
      </div>
      <div class="feedback-body">
        <strong>📖 Explication :</strong><br>${q.explain}
        ${q.hint?`<div class="math-display">${q.hint}</div>`:''}
        <div class="feedback-example"><strong>💡 Exemple :</strong><br>${q.example}</div>
      </div>
    </div>
    <button class="next-btn" onclick="nextQuestion()">
      ${currentIdx+1<currentQs.length?'Question suivante →':'Voir mes résultats 🏁'}
    </button>
  `;
}

function nextQuestion(){
  currentIdx++;
  if(currentIdx>=currentQs.length){showScore();return;}
  renderQuestion();
}

function showScore(){
  const s=SUBJECTS.find(x=>x.id===currentSubject);
  const pct=Math.round((score/currentQs.length)*100);
  const color=pct>=70?'#0F6E56':pct>=50?'#854F0B':'#993C1D';
  const bg=pct>=70?'#E1F5EE':pct>=50?'#FAEEDA':'#FAECE7';
  const msg=pct>=80?'Excellent ! Tu es prêt(e) ! 🏆':pct>=60?'Bien ! Continue à réviser 💪':pct>=40?'Courage, il faut encore travailler ça 📚':'Il faut reprendre ce chapitre depuis le début 🔄';
  hide('quiz-screen');show('score-screen');
  document.getElementById('score-screen').innerHTML=`
    <div class="score-card">
      <div class="score-circle" style="border-color:${color};background:${bg};color:${color}">${pct}%</div>
      <h2 style="font-size:20px;font-weight:700;margin-bottom:8px">${s.emoji} ${s.name}</h2>
      <p style="color:#888;font-size:14px;margin-bottom:1.5rem">${msg}</p>
      <div class="stats-row">
        <div class="stat-box"><div class="val" style="color:#0F6E56">${score}</div><div class="lbl">Bonnes réponses</div></div>
        <div class="stat-box"><div class="val" style="color:#993C1D">${currentQs.length-score}</div><div class="lbl">Erreurs</div></div>
        <div class="stat-box"><div class="val">${currentQs.length}</div><div class="lbl">Total</div></div>
      </div>
      <div>
        <button class="restart-btn" onclick="startQuiz('${currentSubject}','${currentMode}')">🔄 Recommencer</button>
        <button class="restart-btn outline" onclick="showSubject('${currentSubject}')">Changer de mode</button>
        <button class="restart-btn outline" onclick="showMain()">🏠 Accueil</button>
      </div>
    </div>
  `;
}

// Build subject grid
const grid=document.getElementById('subjects-grid');
SUBJECTS.forEach(s=>{
  const card=document.createElement('div');
  card.className='subject-card';
  card.onclick=()=>showSubject(s.id);
  card.innerHTML=`
    <div class="icon" style="background:${s.color}">${s.emoji}</div>
    <h3>${s.name}</h3>
    <p>${s.desc}</p>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
